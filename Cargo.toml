[package]
name = "flight-club"
version = "0.19.2"
edition = "2024"
default-run = "flight-club"

[features]
default = ["desktop"]
desktop = ["dep:macroquad", "dep:cpal"]
cardputer = ["dep:memmap2"]

[[bin]]
name = "flight-club"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "flight-club-cardputer"
path = "src/bin/cardputer.rs"
required-features = ["cardputer"]

[[bin]]
name = "flight-club-audio"
path = "src/bin/audio.rs"

[dependencies]
macroquad = { version = "0.4.16", optional = true }
glam = "0.27"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
libc = "0.2"
memmap2 = { version = "0.9", optional = true }
font8x8 = "0.3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = { version = "0.15.3", optional = true }

[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
