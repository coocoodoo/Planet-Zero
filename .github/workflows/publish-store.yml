name: Publish to CardputerZero Store

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CARDPUTER_STORE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.19.2
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: flight-club-store
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check store credentials
        env:
          GH_TOKEN: ${{ secrets.CARDPUTER_STORE_TOKEN }}
          EXPECTED_OWNER: ${{ github.repository_owner }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Configure CARDPUTER_STORE_TOKEN in repository Actions secrets"
            exit 1
          fi
          owner=$(gh api user --jq .login)
          if [[ "$owner" != "$EXPECTED_OWNER" ]]; then
            echo "::error::CARDPUTER_STORE_TOKEN belongs to $owner; expected $EXPECTED_OWNER"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CardputerZero/AppBuilder
          ref: 18996b694ae305306fc5d457d982cfba0b0e7cc5
          path: .publish-tools/appbuilder
          persist-credentials: false
      - name: Download and validate release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern "flight-club_${RELEASE_TAG#v}_arm64.deb" --pattern SHA256SUMS
          (cd dist && sha256sum --check --ignore-missing SHA256SUMS)
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          tag = os.environ["RELEASE_TAG"]
          manifest = json.loads(Path("app-builder.json").read_text())
          version = manifest["version"]
          deb = f"dist/flight-club_{version}_arm64.deb"
          if tag != f"v{version}":
              raise SystemExit("Release tag and app-builder.json version differ")
          expected = {"Package": manifest["package_name"], "Version": version, "Architecture": "arm64"}
          for field, value in expected.items():
              actual = subprocess.check_output(["dpkg-deb", "-f", deb, field], text=True).strip()
              if actual != value:
                  raise SystemExit(f"Package {field}: expected {value}, got {actual}")
          PY
      - name: Submit store update
        env:
          GH_TOKEN: ${{ secrets.CARDPUTER_STORE_TOKEN }}
          GIT_AUTHOR_NAME: ${{ github.repository_owner }}
          GIT_AUTHOR_EMAIL: ${{ github.repository_owner }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.repository_owner }}
          GIT_COMMITTER_EMAIL: ${{ github.repository_owner }}@users.noreply.github.com
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: 'git@github.com:'
          GIT_CONFIG_KEY_1: credential.https://github.com.helper
          GIT_CONFIG_VALUE_1: ''
          GIT_CONFIG_KEY_2: credential.https://github.com.helper
          GIT_CONFIG_VALUE_2: '!gh auth git-credential'
        run: |
          trap 'rm -f "$HOME/.czdev/credentials"' EXIT
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          credentials = Path.home() / ".czdev" / "credentials"
          credentials.parent.mkdir(parents=True, exist_ok=True)
          credentials.write_text(json.dumps({"github_token": os.environ["GH_TOKEN"]}))
          credentials.chmod(0o600)
          PY
          .publish-tools/appbuilder/czdev publish \
            --deb "dist/flight-club_${RELEASE_TAG#v}_arm64.deb" | tee "$RUNNER_TEMP/store-publish.log"
          pr_url=$(sed -n 's/^ *\(https:\/\/github.com\/CardputerZero\/packages\/pull\/[0-9]*\) *$/\1/p' "$RUNNER_TEMP/store-publish.log")
          if [[ -n "$pr_url" ]]; then
            echo "Store update PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          fi
